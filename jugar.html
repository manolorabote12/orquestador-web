<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Juega · Orquestador</title>
<meta name="description" content="Un juego hecho con Orquestador. Juégalo en el navegador y crea el tuyo describiéndolo con palabras.">
<meta property="og:title" content="Juega a este juego hecho con Orquestador">
<meta property="og:description" content="Pulsa para jugar en el navegador. Crea el tuyo describiéndolo con palabras.">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="estilo.css">
<script src="config.js"></script>
<style>
  html, body { height: 100%; }
  body { overflow: hidden; touch-action: none; }
  #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: none; outline: none; background: #0b0f1a; }
  #portada { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 24px 16px; text-align: center; background-size: cover; background-position: center; }
  #portada::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,30,54,.55), rgba(10,30,54,.92)); }
  #portada > * { position: relative; }
  #icono { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 12px 40px rgba(0,0,0,.5); display: none; }
  #titulo { font: 800 clamp(34px, 9vw, 56px)/1 "Big Shoulders Stencil Display", Impact, sans-serif; margin: 0; }
  #jugar { font-size: 22px; padding: 16px 44px; border-radius: 14px; }
  #barra { width: min(280px, 70vw); height: 10px; border-radius: 6px; background: #16233a; overflow: hidden; display: none; }
  #barra i { display: block; height: 100%; width: 0; background: var(--brass); transition: width .2s; }
  #hecho { position: fixed; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 5; display: none; background: rgba(10,30,54,.85);
    border: 1px solid rgba(232,176,75,.5); color: var(--ink); text-decoration: none; padding: 6px 10px; border-radius: 10px; font-size: 13px; transition: opacity .6s; }
  .crea { font-size: 15px; }
  #reto { border: 1px solid var(--brass); color: var(--brass-hi, #f6cf7a); border-radius: 12px; padding: 10px 14px; max-width: 30em; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<div id="portada">
  <img id="icono" alt="">
  <h1 id="titulo">Cargando...</h1>
  <p id="sub" class="dim"></p>
  <p id="reto" hidden></p>
  <button class="btn" id="jugar" disabled>▶ Jugar</button>
  <div id="barra"><i></i></div>
  <p id="msg" class="msg" role="status"></p>
  <p class="crea dim">Hecho con <b>Orquestador</b>: describe un juego y juégalo en minutos.<br><a href="./">Crea el tuyo gratis</a></p>
</div>
<a id="hecho" href="./" target="_blank" rel="noopener">⚙ Hecho con Orquestador</a>
<script>
(function () {
  var c = window.ORQ || {};
  var $ = function (id) { return document.getElementById(id); };
  var j = new URLSearchParams(location.search).get("j") || "";
  // Reto de un amigo (?reto=3480&n=2&de=Dani): el juego lo lee tambien y al acabar dice si lo has superado.
  var q = new URLSearchParams(location.search);
  var reto = parseInt(q.get("reto") || "", 10), nivel = parseInt(q.get("n") || "1", 10);
  if (reto > 0 && nivel > 0) {
    var de = (q.get("de") || "Un amigo").slice(0, 14);
    $("reto").textContent = "🏆 " + de + " te reta: supera " + reto.toLocaleString("es-ES") + " puntos en el nivel " + nivel;
    $("reto").hidden = false;
  }
  function msg(t, e) { $("msg").textContent = t; $("msg").className = "msg" + (e ? " error" : ""); }
  if (!/^[0-9a-f-]{36}$/i.test(j)) { $("titulo").textContent = "Juego no encontrado"; return; }
  var pub = c.supabase + "/storage/v1/object/public/";
  var rpc = function (fn, body) {
    return fetch(c.supabase + "/rest/v1/rpc/" + fn, { method: "POST", headers: { apikey: c.anon, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  };
  // 1 - Ficha publica (si se retiro o se oculto por denuncias, no se juega). Si no esta en el
  //     escaparate puede ser un juego regalo (enlace privado): "Un regalo para Lucia, de Dani".
  var regalo = false;
  var json = function (r) { return r.json(); };
  rpc("escaparate_ficha", { p_project: j }).then(json).then(function (filas) {
    var f = Array.isArray(filas) ? filas[0] : null;
    if (f) return f;
    return rpc("regalo_ficha", { p_project: j }).then(json).then(function (g) {
      if (!g || !g.para) return null;
      regalo = true;
      return g;
    });
  }).then(function (f) {
    if (!f) { $("titulo").textContent = "Este juego ya no está disponible"; return; }
    if (regalo) {
      document.title = "Un regalo para " + f.para;
      $("titulo").textContent = "🎁 Para " + f.para;
      $("sub").textContent = "Un juego hecho para ti por " + f.de + ". Hay un mensaje escondido dentro.";
      $("jugar").textContent = "Abrir el regalo";
    } else {
      document.title = f.titulo + " · Juega gratis";
      $("titulo").textContent = f.titulo;
      $("sub").textContent = (f.autor ? "de " + f.autor + " · " : "") + f.jugadas + " partidas · " + f.megusta + " me gusta";
    }
    var base = pub + "escaparate/" + j + "/";
    var icono = $("icono");
    icono.onload = function () { icono.style.display = "block"; };
    icono.src = base + "icono.png?v=" + f.version;
    var img = new Image();
    img.onload = function () { $("portada").style.backgroundImage = "url('" + img.src + "')"; };
    img.src = base + "portada.png?v=" + f.version;
    $("jugar").disabled = false;
    $("jugar").onclick = function () { arrancar(base + "index.pck?v=" + f.version); };
  }).catch(function () { $("titulo").textContent = "Sin conexión"; });

  // 2 - Motor web de Godot comun (en cache del navegador) + el paquete de este juego.
  function arrancar(pck) {
    $("jugar").style.display = "none";
    $("barra").style.display = "block";
    msg("Cargando el motor...");
    var motor = pub + "motor/" + c.motor;
    var s = document.createElement("script");
    s.src = motor + "/index.js";
    s.onerror = function () { msg("No se pudo descargar el juego. Revisa tu conexión.", true); };
    s.onload = function () {
      if (typeof Engine === "undefined" || !Engine.isWebGLAvailable(2)) { msg("Tu navegador no puede mostrar este juego (falta WebGL 2).", true); return; }
      var e = new Engine({ executable: motor + "/index", mainPack: pck, canvasResizePolicy: 2, args: [],
        ensureCrossOriginIsolationHeaders: false, focusCanvas: true });
      msg("Cargando el juego...");
      $("canvas").style.display = "block";
      e.startGame({ onProgress: function (a, t) { if (t > 0) $("barra").firstElementChild.style.width = Math.round(100 * a / t) + "%"; } })
        .then(function () {
          $("portada").style.display = "none";
          var h = $("hecho"); h.style.display = "block";
          setTimeout(function () { h.style.opacity = "0"; setTimeout(function () { h.style.display = "none"; }, 700); }, 6000);
          rpc(regalo ? "regalo_abierto" : "escaparate_jugada", { p_project: j }).catch(function () {});
        })
        .catch(function (x) { $("canvas").style.display = "none"; msg(String(x && x.message || x), true); });
    };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
